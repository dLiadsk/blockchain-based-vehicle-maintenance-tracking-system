spring.application.name=vehicle-service-api

# ============================================================================
# POSTGRESQL DATABASE CONFIGURATION
# ============================================================================
# Ensure that a database named 'vehicle-service' is created in your PostgreSQL instance (e.g., via pgAdmin)
spring.datasource.url=jdbc:postgresql://localhost:5432/vehicle-service
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Automatically update the database schema to match JPA Entities
spring.jpa.hibernate.ddl-auto=update
# Log all generated SQL queries to the console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ============================================================================
# LOCAL BLOCKCHAIN CONFIGURATION (HARDHAT)
# ============================================================================
blockchain.rpc-url=http://127.0.0.1:8545

# Default private key for Account #0 provided by the 'npx hardhat node' instance
blockchain.admin-private-key=0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80

# Address of the deployed smart contract. NOTE: Update this value after every new contract deployment!
blockchain.contract-address=0x5FbDB2315678afecb367f032d93F642f64180aa3

# ============================================================================
# JWT AUTHENTICATION CONFIGURATION
# ============================================================================
# Secret key used for cryptographic token signing (must be at least 32 characters)
jwt.secret=mySecretKeyForVehicleServiceProject2026TokenEncryption

# Token expiration lifetime in milliseconds (86400000 ms = 24 hours)
jwt.lifetime=86400000

# ============================================================================
# DEFAULT SPRING SECURITY CONFIGURATION
# ============================================================================
# Fallback basic authentication credentials (overridden by JWT implementation)
spring.security.user.name=admin
spring.security.user.password=admin